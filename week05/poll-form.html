<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poll Form</title>
    <link rel="stylesheet" href="styles/poll-form.css">
</head>

<header>

    <h1>WDD 130 / HTML Form - User Poll</h1>

</header>

<body>

    <form>
        <fieldset>
            <legend>Contact Information</legend>

            <div class="form-item column2">
                <label for="fullname">Full Name: </label>
                <input type="text" id="fullname" name="fullname" required>
            </div>

            <div class="form-item column2">
                <label for="email">Email Address:</label>
                <input type="email" id="useremail" name="useremail" required>
            </div>

        </fieldset>
    </form>


    <form>
        <fieldset>
            <legend>Questions</legend>

            <div class="column1">
                <label for="browser">What is your favorite browser? </label>
                <select name="browser" id="browser">
                    <option value="browser">Chrome</option>
                    <option value="browser">Firefox</option>
                    <option value="browser">Other</option>
                </select>
            </div>

            <div class="column1">
                <label><input type="checkbox" id="pet" name="pet">Do you have a household
                    pet?</label>
            </div>


            <label for="feedback">List the places you have lived.</label>
            <textarea id="feedback" name="feedback" rows="3"
              placeholder="Stillwater Florida, Amsterdam Netherlands, Detroit, Michigan"></textarea>

            <button type="submit">Submit Poll</button>
        </fieldset>
    </form>
</body>

<footer>

</footer>
